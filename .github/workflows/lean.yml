name: Lean

on:
  # Check feature branches through PRs, never duplicate a push build.
  push:
    branches: [main]
    paths:
      - 'GluingEPPA/**'
      - 'GluingEPPA.lean'
      - 'scripts/**'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'GluingEPPA/**'
      - 'GluingEPPA.lean'
      - 'scripts/**'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Match the caching strategy in lean-successors: the Lean toolchain is
      # reusable across all branches, while Lake uses ONE pinned main cache.
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      - name: Restore shared pinned Lake workspace
        id: lake-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake
          # lake-manifest.json is intentionally untracked and generated by
          # lake update. Including it in the key makes restore and save differ
          # within a single job. The mathlib revision is pinned in lakefile.
          key: lake-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}
          restore-keys: |
            lake-v3-${{ runner.os }}-${{ runner.arch }}-

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned Lake dependencies
        run: |
          if test -s lake-manifest.json; then
            echo "Using cached pinned Lake manifest"
          else
            lake update
          fi

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Build
        id: build
        run: |
          mkdir -p proof-audit
          if ! lake build > proof-audit/build.log 2>&1; then
            cat proof-audit/build.log
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          lines = Path("proof-audit/build.log").read_text(encoding="utf-8").splitlines()
          print(f"PASS: full Lean build ({sum('warning:' in x for x in lines)} warnings, {sum('Hint:' in x for x in lines)} hints)")
          PY

      - name: Audit theorem axioms
        id: audit
        run: |
          if ! lake env lean scripts/CheckAxioms.lean > proof-audit/axioms.log 2>&1; then
            cat proof-audit/axioms.log
            exit 1
          fi
          python3 scripts/check-axiom-log.py proof-audit/axioms.log

      - name: Finite sparsening regressions
        id: finite-checks
        run: |
          python3 scripts/check_saturated_cover.py --exhaustive --output proof-audit/sparsening-regressions.json
          python3 scripts/check_atlas_action.py --output proof-audit/affine-regressions.json

      - name: Record checked proof snapshot
        if: always()
        run: |
          mkdir -p proof-audit
          git rev-parse HEAD > proof-audit/COMMIT
          cp lean-toolchain lakefile.toml proof-audit/
          if test -f lake-manifest.json; then cp lake-manifest.json proof-audit/; fi
          git diff --check
          (cd proof-audit && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Seed shared Lake cache from main only
        # PRs restore the main cache but NEVER upload a new multi-GB workspace.
        # Save only after proofs, axiom audits and finite regressions pass.
        if: ${{ github.ref == 'refs/heads/main' && steps.lake-cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success' && steps.audit.outcome == 'success' && steps.finite-checks.outcome == 'success' && !cancelled() }}
        uses: actions/cache/save@v5
        with:
          path: .lake
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}

      - name: Upload proof audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gluing-eppa-proof-audit
          path: proof-audit/
          retention-days: 30
