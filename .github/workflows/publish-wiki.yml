name: Publish gluing EPPA wiki

on:
  # The separate Wiki repository was initialized on 15 October 2026.
  # Do not re-trigger publication on every direct Wiki edit: the publisher
  # uses a force push and docs/wiki/ is the authoritative source.
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

concurrency:
  group: publish-gluing-eppa-wiki
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out versioned wiki source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check internal wiki and source links
        run: python3 scripts/check_wiki_docs.py

      # GitHub stores Wikis in a separate .wiki.git repository.
      # It is created only after the first Home page is saved in the UI.
      - name: Check whether the Wiki Git repository exists
        id: wiki
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          if git ls-remote "https://github.com/${GITHUB_REPOSITORY}.wiki.git" HEAD >/dev/null 2>&1; then
            echo "initialized=true" >> "$GITHUB_OUTPUT"
          else
            echo "initialized=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Wiki is not initialized. Create the first Home page at https://github.com/${GITHUB_REPOSITORY}/wiki; this workflow will then publish the pages."
          fi

      # This action invokes `git push -f`: manual Wiki-only changes can be
      # overwritten. Merge edits to docs/wiki/ instead.
      - name: Sync source pages to GitHub Wiki tab
        if: steps.wiki.outputs.initialized == 'true'
        uses: Andrew-Chen-Wang/github-wiki-action@1bbb4280446f9630e8e21a18012cbacf3b0f992e # v5
        with:
          path: docs/wiki
          preprocess: true
          strategy: clone
          disable-empty-commits: true
