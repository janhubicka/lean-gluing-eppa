name: Pair valuation core

on:
  pull_request:
    paths:
      - 'GluingEPPA/Reducts/PairValuationConjugation.lean'
      - 'scripts/CheckPairValuationAxioms.lean'
      - '.github/workflows/pair-valuation.yml'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pair-valuation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lean-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile full valuation action formulas
        run: |
          mkdir -p proof-audit
          git rev-parse HEAD | tee proof-audit/source-sha.txt
          lean --version | tee proof-audit/lean-version.txt
          if ! lean GluingEPPA/Reducts/PairValuationConjugation.lean > proof-audit/pair-valuation.log 2>&1; then
            cat proof-audit/pair-valuation.log
            exit 1
          fi
          cat proof-audit/pair-valuation.log
      - name: Audit exact nine-declaration manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path('GluingEPPA/Reducts/PairValuationConjugation.lean').read_text()
          code = re.sub(r'/\-.*?\-/', '', src, flags=re.S)
          assert not re.search(r'\b(sorry|admit|axiom)\b', code)
          log = Path('proof-audit/pair-valuation.log').read_text()
          expected = set(re.findall(r'^#print axioms (\S+)', Path('scripts/CheckPairValuationAxioms.lean').read_text(), re.M))
          found = re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]", log, re.S)
          found += [(n, '') for n in re.findall(r"'([^']+)' does not depend on any axioms", log)]
          assert len(expected) == 9 and len(found) == 9
          assert {n for n, _ in found} == expected
          for name, raw in found:
              deps = {x.strip() for x in raw.split(',') if x.strip()}
              assert deps <= {'propext', 'Classical.choice', 'Quot.sound'}, (name, deps)
          assert 'sorryAx' not in log and 'error:' not in log
          print('PASS: exact nine-declaration valuation-action audit; finite padding and EPPA assembly are not claimed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pair-valuation-core-${{ github.event.pull_request.head.sha || github.sha }}
          path: proof-audit/
