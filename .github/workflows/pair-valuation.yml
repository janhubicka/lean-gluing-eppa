name: Pair valuation core

on:
  pull_request:
    paths:
      - 'GluingEPPA/Reducts/**'
      - 'scripts/CheckPairValuationAxioms.lean'
      - 'scripts/CheckMultipartitePreparationAxioms.lean'
      - '.github/workflows/pair-valuation.yml'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pair-valuation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lean-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile concrete replication and valuation maps
        run: |
          mkdir -p proof-audit
          git rev-parse HEAD | tee proof-audit/source-sha.txt
          lean --version | tee proof-audit/lean-version.txt
          export LEAN_PATH="$PWD"
          for module in PairValuationConjugation PairRowCompletion MultipartiteReplication; do
            path="GluingEPPA/Reducts/$module"
            if ! lean -o "$path.olean" "$path.lean" > "proof-audit/$module.log" 2>&1; then
              cat "proof-audit/$module.log"
              exit 1
            fi
            cat "proof-audit/$module.log"
          done
          for manifest in CheckPairValuationAxioms CheckMultipartitePreparationAxioms; do
            lean "scripts/$manifest.lean" > "proof-audit/$manifest.log" 2>&1 || { cat "proof-audit/$manifest.log"; exit 1; }
            python3 scripts/check-axiom-log.py "proof-audit/$manifest.log" "scripts/$manifest.lean"
          done
      - name: Reject source placeholders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ('PairValuationConjugation', 'PairRowCompletion', 'MultipartiteReplication'):
              source = Path(f'GluingEPPA/Reducts/{name}.lean').read_text()
              code = re.sub(r'/\-.*?\-/', '', source, flags=re.S)
              code = re.sub(r'--[^\n]*', '', code)
              assert not re.search(r'\b(sorry|admit|axiom|native_decide|unsafe)\b', code), name
          print('PASS: concrete replication and row completion; common finite atlas and full EPPA not claimed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pair-valuation-core-${{ github.event.pull_request.head.sha || github.sha }}
          path: proof-audit/
