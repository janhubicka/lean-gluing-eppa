name: Multipartite concrete witness

on:
  pull_request:
    paths:
      - 'GluingEPPA/Reducts/**'
      - 'scripts/CheckMultipartite*Axioms.lean'
      - '.github/workflows/multipartite-concrete.yml'
      - 'lean-toolchain'
      - 'lakefile.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multipartite-concrete-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  concrete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: lake-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}
          restore-keys: |
            lake-v3-${{ runner.os }}-${{ runner.arch }}-
      - name: Toolchain and dependencies
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          test -s lake-manifest.json || lake update
          lake exe cache get
      - name: Build actual finite witness and partial-base maps
        run: |
          mkdir -p concrete-audit
          git rev-parse HEAD > concrete-audit/source-sha.txt
          lean --version > concrete-audit/lean-version.txt
          lake build GluingEPPA.Reducts.MultipartitePartialBase > concrete-audit/build.log 2>&1 || { cat concrete-audit/build.log; exit 1; }
          for m in ConcreteCarrier ActualActions LocalWitness WitnessScope PartialBase; do
            manifest="scripts/CheckMultipartite${m}Axioms.lean"
            log="concrete-audit/CheckMultipartite${m}Axioms.log"
            lake env lean "$manifest" > "$log" 2>&1 || { cat "$log"; exit 1; }
            python3 scripts/check-axiom-log.py "$log" "$manifest"
          done
      - name: Record exact sources
        if: always()
        run: |
          mkdir -p concrete-audit/source concrete-audit/manifests
          cp GluingEPPA/Reducts/*.lean concrete-audit/source/
          cp scripts/CheckMultipartite*Axioms.lean concrete-audit/manifests/
          cp lean-toolchain lakefile.toml concrete-audit/
          (cd concrete-audit && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multipartite-concrete-${{ github.event.pull_request.head.sha || github.sha }}
          path: concrete-audit/
