name: Temporary Steiner macOS Lean validation

on:
  pull_request:
    paths:
      - 'GluingEPPA/Steiner/ChainValuation/**'
      - 'scripts/CheckChainValuationAxioms.lean'
      - '.github/workflows/agent-steiner-macos-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steiner-agent-macos-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned macOS Lean cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            .lake
          key: steiner-macos-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}
          restore-keys: |
            steiner-macos-${{ runner.arch }}-

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version

      - name: Obtain pinned Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if [ ! -s lake-manifest.json ]; then lake update; fi
          lake exe cache get

      - name: Check the exact cross-layer lemma first
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p proof-audit
          lake build GluingEPPA.Steiner.ChainValuation.ExactCrossLayerWitness > proof-audit/cross-layer.log 2>&1 || {
            cat proof-audit/cross-layer.log; exit 1;
          }
          tail -n 20 proof-audit/cross-layer.log

      - name: Check exact historic boundary overlap
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GluingEPPA.Steiner.ChainValuation.HistoricalExactOverlap > proof-audit/historical-overlap.log 2>&1 || {
            cat proof-audit/historical-overlap.log; exit 1;
          }
          tail -n 20 proof-audit/historical-overlap.log

      - name: Check embedded interface and finite chain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GluingEPPA.Steiner.ChainValuation.HistoricalEmbeddedInterface > proof-audit/historical-embedded.log 2>&1 || {
            cat proof-audit/historical-embedded.log; exit 1;
          }
          tail -n 20 proof-audit/historical-embedded.log

      - name: Audit all chain valuation theorem axioms
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean scripts/CheckChainValuationAxioms.lean > proof-audit/axioms.log 2>&1 || {
            cat proof-audit/axioms.log; exit 1;
          }
          python3 scripts/check-axiom-log.py proof-audit/axioms.log scripts/CheckChainValuationAxioms.lean

      - name: Record source and upload diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p proof-audit
          git rev-parse HEAD > proof-audit/SOURCE_SHA
          cp lean-toolchain lakefile.toml proof-audit/
          if test -f lake-manifest.json; then cp lake-manifest.json proof-audit/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: steiner-macos-proof-audit
          path: proof-audit/
          retention-days: 5
